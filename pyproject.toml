[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-carrier-portal"
version = "0.1.0"
description = "Self-hosted carrier information connector"
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "PyMySQL>=1.1,<2",
    "python-multipart>=0.0.18,<1",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[project.scripts]
ocp = "open_carrier_portal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/open_carrier_portal"]

[tool.pytest.ini_options]
addopts = "-q -p no:asyncio"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
